{% load static %}
<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | VeriCode</title>


<style>
    body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }

    .login-box {
        background: white;
        width: 350px;
        padding: 30px;
        border: 1px solid #ddd;
        border-radius: 8px;
    }

    h1 {
        text-align: center;
        margin-bottom: 25px;
    }

    input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }

    button {
        width: 100%;
        padding: 10px;
        background: black;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    button:hover {
        background: #333;
    }

    #message {
        margin-top: 15px;
        text-align: center;
    }
</style>


</head>

<body>


<div class="login-box">

    <h1>VeriCode</h1>

    <form id="loginForm">

        <input
            type="text"
            id="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p id="message"></p>

</div>

<script src="{% static 'frontend/js/auth.js' %}"></script>

<script>
    document.getElementById("loginForm").addEventListener("submit", async function(event) {

        event.preventDefault();

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const message = document.getElementById("message");

        try {

            await login(username, password);

            message.textContent = "Login successful";

            window.location.href = "/";

        } catch (error) {

            message.textContent = error.message;

        }

    });
</script>


</body>
</html>
